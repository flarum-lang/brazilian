fof-upload:
  admin:
    help_texts:
      client_extension: "Por padrão, o Upload escolhe uma extensão de arquivo segura com base no tipo MIME.\nPara alguns tipos de arquivo baseados em ZIP ou em dados binários, isso pode resultar no uso de extensões genéricas em vez da esperada.\nAqui você pode informar uma lista de extensões de arquivo, separadas por vírgula, que serão mantidas como estão.\n"
      composer_buttons: "Por padrão, o botão do gerenciador de mídia e o botão de upload ficam visíveis. Você também pode optar por exibir apenas um deles.\n"
      custom_s3_url: "A URL base pública de onde seus arquivos são servidos — uma CDN ou um domínio personalizado à frente do bucket.\nDeixe em branco para usar a URL padrão do provedor. Deve incluir <code>https://</code>.\n"
      disable-download-logging: "Desativa o registro de cada download feito pelos usuários do fórum. Mantê-lo ativado permitirá ver o número de downloads e outras métricas em um futuro próximo.\n"
      disable-hotlink-protection: "A proteção de hotlink impede a abertura de downloads a partir de outros sites. O método atual requer um token csrf e o ID do post.\n"
      download_templates: "Os modelos de download definem como os uploads são mostrados no fórum, ex.: como prévias ou botões. Disponíveis atualmente:\n"
      local_cdn: "Opcional. Se você serve <code>assets/files</code> por uma CDN, informe a URL base dela e os links dos arquivos enviados a usarão.\nDeixe em branco para servir os arquivos diretamente do fórum.\n"
      mime_order: "As regras são avaliadas de cima para baixo e a primeira correspondência vence; por isso, coloque as regras mais específicas acima das gerais.\n"
      mime_types: "Decida quais arquivos os membros podem enviar, onde cada tipo é armazenado e como aparece em um post.\n"
      resize: "Escolha se deseja redimensionar suas imagens antes de serem enviadas. Você pode escolher uma largura e uma altura máximas, em pixels. O redimensionamento mantém a proporção das imagens.\n"
      s3_acl: "Aplicada a cada objeto enviado. Deixe em branco para usar o padrão do provedor (geralmente privado).\nUse <code>public-read</code> se os arquivos precisarem ser lidos diretamente do bucket.\n"
      s3_acl_unsupported: "{provider} não oferece suporte a ACLs. Controle o acesso público no dashboard do próprio provedor.\n"
      s3_compatible_storage: "As configurações a seguir são necessárias apenas ao usar armazenamento compatível com S3. Se você usa a AWS, pode deixá-los em branco.\n"
      s3_endpoint: "A URL da API S3 do provedor — não a URL pública do seu bucket. O Amazon S3 não precisa de uma.\n"
      s3_instance_profile: "Deixe ambos em branco para usar uma função do IAM (IAM role) — só funciona em EC2, ECS ou EKS.\n"
      s3_path_style: "Coloca o bucket no caminho da URL em vez do hostname. Exigido por MinIO e Cloudflare R2;\ndefinido automaticamente quando você escolhe um provedor.\n"
      s3_provider: "Escolher o provedor define o formato do endpoint, o estilo de endereçamento e o suporte a ACL abaixo. Escolha \"Other S3-compatible\"\nse o seu não estiver na lista.\n"
      storage_configure_another: "Há outros serviços de armazenamento instalados, mas ainda não configurados. Configurar um deles não muda o destino dos arquivos\naté que você o atribua a um tipo de arquivo.\n"
      storage_intro: "Os serviços que você configurou, ou que algum tipo de arquivo usa, são mostrados aqui. Você pode configurar um serviço\nantes de apontar qualquer tipo de arquivo para ele — atribua-o na aba Arquivos quando estiver tudo pronto.\n"
      storage_not_installed: 'Procurando Amazon S3, Cloudflare R2 ou Qiniu? Eles precisam de um pacote extra — veja <a>como instalar adaptadores de armazenamento</a>.'
      thumbnail_quality: "Qualidade de codificação de 1 a 100, aplicada às miniaturas WebP e JPEG. Valores mais altos ficam mais nítidos,\nmas geram arquivos maiores. Miniaturas GIF e PNG não têm perdas e ignoram esta configuração.\nAs miniaturas existentes mantêm a qualidade atual até serem regeneradas com o comando de backfill.\n"
      thumbnails: "Gera uma miniatura reduzida das imagens no momento do upload. A miniatura é exibida no post;\nclicar nela abre o arquivo original em resolução total em uma nova aba. As miniaturas reduzem\nbastante o consumo de banda e o peso das páginas em fóruns com muitas imagens grandes.\n"
      watermark: "Escolha se as imagens receberão uma marca d'água durante o upload. As marcas d'água são adicionadas a imagens que não sejam GIF, com base nas preferências abaixo.\n"
    inspect-mime:
      description: "O FoF Upload usa a biblioteca <a>PHP Mime Detector</a> para tipos MIME comuns e o PHP Fileinfo como fallback.\nO valor MIME retornado pelo Fileinfo pode variar de servidor para servidor!\n"
